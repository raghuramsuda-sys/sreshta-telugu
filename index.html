/* ===== Letters to Nanna & Amma (unlock when the week is FULLY complete; she writes on her own) ===== */
function letterState(wk) {
  var daysDone = 0;
  if (wk.days) wk.days.forEach(function(d) { if (store[d.id] && store[d.id].done) daysDone++; });
  var weekly = null;
  EXAMS.forEach(function(e) { if (e.week === wk.n && !e.zone && !e.read && e.title.indexOf("Weekly") === 0) weekly = e; });
  var weeklyOk = !!(weekly && exams[weekly.id] && exams[weekly.id].passed);
  var missing = [];
  if (wk.days && daysDone < wk.days.length) missing.push("Days (" + daysDone + "/" + wk.days.length + ")");
  if (!weeklyOk) missing.push("Weekly Exam");
  EXAMS.forEach(function(e) {
    if (e.week === wk.n && e.zone) {
      var r = exams[e.id];
      if (!r || !(r.tries > 0)) missing.push(e.title.replace(/^[^A-Za-z]+/, ""));
    }
  });
  return { unlocked: missing.length === 0, missing: missing };
}

  renderReadQ();
}
function stopRecTracks() { if (recStream) { recStream.getTracks().forEach(function(t) { try { t.stop(); } catch (e) {} }); recStream = null; } }
function startRec() {
  if (!mrSupported()) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    recStream = stream; recChunks = [];
    try { mediaRec = new MediaRecorder(stream); } catch (e) { stopRecTracks(); toast("Recording not supported on this phone"); return; }
    mediaRec.ondataavailable = function(ev) { if (ev.data && ev.data.size) recChunks.push(ev.data); };
    mediaRec.onstop = function() {
      stopRecTracks();
      if (recChunks.length) { try { recBlob = new Blob(recChunks, { type: mediaRec.mimeType || "audio/webm" }); } catch (e) { recBlob = null; } }
      recState = recBlob ? "done" : "idle";
      if (finishPending) { finishPending = false; renderReadDone(); } else if (readCur) renderReadQ();
    };
    mediaRec.start();
    recState = "rec";
    renderReadQ();
  }).catch(function() { toast("Microphone is off \u2014 tap Allow when the phone asks, then try again"); });
}
function stopRec() { if (mediaRec && recState === "rec") { try { mediaRec.stop(); } catch (e) {} } }
function renderReadQ() {
  if (!readCur) return;
  var it = readCur.set[readCur.i];
  var sup = mrSupported();
  var recHtml = "";
  if (!sup) recHtml = "<p class='sub'>This phone cannot record here \u2014 read aloud to Amma instead!</p>";
  else if (recState === "idle") recHtml = "<button class='btn' id='recbtn' style='background:#E63946;color:#fff'>\uD83C\uDF99\uFE0F Start Recording</button>";
  else if (recState === "rec") recHtml = "<button class='btn' id='stopbtn'>\u23F9 Stop Recording</button><p class='sub' style='color:#C62828;font-weight:900'>\uD83D\uDD34 Recording\u2026 read each word aloud, then tap Next</p>";
  else recHtml = "<p class='sub' style='font-weight:900;color:#146C43'>\u2714 Recorded! You will hear it at the end.</p>";
  var nav = readCur.i < readCur.set.length - 1
    ? "<button class='btn green' id='readnext'>Next Word \u27A1</button>"
    : "<button class='btn green' id='readfinish'>Finish \u2714</button>";
  var h = "<button class='backlink' onclick='renderHome()'>&#8592; All Weeks</button>"
    + "<h2>\uD83D\uDCD6 Reading Exam</h2>"
    + "<p class='sub'>Word " + (readCur.i + 1) + " of " + readCur.set.length + " \u2022 Read it aloud!</p>"
    + "<div class='quizword' style='font-size:58px'>" + it.word + "</div>"
    + "<p class='sub'>" + it.trans + " \u2022 " + it.mean + "</p>"
    + "<div class='center'>" + recHtml + "</div>"
    + "<div class='center' style='margin-top:10px'>" + nav + "</div>";
  app().innerHTML = h; window.scrollTo(0, 0);
  var rb = document.getElementById("recbtn"); if (rb) rb.addEventListener("click", startRec);
  var sb = document.getElementById("stopbtn"); if (sb) sb.addEventListener("click", stopRec);
  var nx = document.getElementById("readnext"); if (nx) nx.addEventListener("click", function() { readCur.i++; renderReadQ(); });
  var fn = document.getElementById("readfinish"); if (fn) fn.addEventListener("click", function() {
    if (recState === "rec") { finishPending = true; stopRec(); }
    else renderReadDone();
  });
}
function renderReadDone() {
  if (!readCur) return;
  if (!readCur.saved) {
    readCur.saved = true;
    var exid = "w" + readCur.wk + "read", prev = exams[exid] || { tries: 0 };
    exams[exid] = { best: 100, last: 100, tries: (prev.tries || 0) + 1, passed: true, stars: 5, ts: Date.now() };
    save(); pushCloud();
  }
  var audioHtml = "";
  if (recBlob && typeof URL !== "undefined" && URL.createObjectURL) {
    audioHtml = "<p class='sub' style='font-weight:900'>\uD83C\uDFA7 Hear yourself!</p><audio controls src='" + URL.createObjectURL(recBlob) + "' style='width:92%'></audio>"
      + "<div class='center' style='margin-top:10px'><button class='btn green' id='sendnanna'>\uD83D\uDCE9 Send to Nanna</button></div>";
  }
  var h = "<div class='center' style='font-size:38px'>\uD83C\uDF89</div><h1>Reading Complete!</h1>"
    + "<div class='finishstars' style='font-size:44px;color:#1E9E62'>\u2605 5</div>"
    + "<p class='sub'>You read 10 words aloud. Superb reading, Sreshta!</p>"
    + audioHtml
    + "<div class='center' style='margin-top:12px'><button class='btn' onclick='startReading(" + readCur.wk + ")'>\uD83D\uDD01 New Words</button> <button class='btn green' onclick='renderHome()'>\uD83C\uDFE0 All Weeks</button></div>";
  app().innerHTML = h; window.scrollTo(0, 0);
  var sn = document.getElementById("sendnanna"); if (sn) sn.addEventListener("click", shareRec);
}
function shareRec() {
  if (!recBlob) return;
  var ext = (recBlob.type || "").indexOf("mp4") >= 0 ? "mp4" : "webm";
  var fname = "Sreshta-Reading-Telugu." + ext;
  try {
    var f = new File([recBlob], fname, { type: recBlob.type || "audio/webm" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: "Sreshta reading Telugu" }).catch(function() {}); return; }
  } catch (e) {}
  var a = document.createElement("a");
  a.href = URL.createObjectURL(recBlob); a.download = fname; a.click();
  toast("Recording saved \u2014 send it to Nanna on WhatsApp!");
}

/* ===== Palle Panduga passcode door (Village Festival sample) =====
   First screen on every load. Sreshta enters with PIN 2017 through the very
   same setGuest() path as the name screen, so her cloud identity and
   progress are untouched. Parents reach the existing renderPin() flow.
   Guests use the existing name screen, unchanged. */
var DOOR_PIN_SRESHTA = "2017";
var doorPinBuf = "";
function doorHead() {
  return "<div class='thoranam' aria-hidden='true'></div>"
    + "<p class='festeyebrow'>&#127802; Palle Panduga &bull; Telugu Village Festival</p>"
    + "<h1>&#127802; \u0C36\u0C4D\u0C30\u0C47\u0C37\u0C4D\u0C1F\u0C3E's Telugu Adventure</h1>"
    + "<p class='sub'>Reading &amp; writing, under the mango leaves!</p>"
    + "<div class='muggudots' aria-hidden='true'></div>";
}
function renderDoor() {
  var h = doorHead()
    + "<div class='doorcard'><h2>Who has come to play?</h2>"
    + "<button class='doorbtn leaf' onclick='doorSreshta()'>&#11088; Sreshta</button>"
    + "<button class='doorbtn mari' onclick='renderDoorParents()'>&#128106; Parents</button>"
    + "<button class='doorbtn turm' onclick='doorGuest()'>&#129489; Guest</button>"
    + "<p class='sub' style='margin-top:8px'>Sreshta and Parents open their doors with a secret passcode.</p></div>";
  app().innerHTML = h; window.scrollTo(0, 0);
}
function doorGuest() { window.__doorPassed = true; renderNameScreen(); }
function renderDoorParents() {
  var h = doorHead()
    + "<div class='doorcard'><h2>&#128106; Parents</h2>"
    + "<p class='sub'>Pick a status page &mdash; your own PIN opens it, just like before.</p>"
    + "<button class='doorbtn mari' onclick='doorStatus(\"amma\")'>&#128155; Amma Status</button>"
    + "<button class='doorbtn leaf' onclick='doorStatus(\"nanna\")'>&#9992;&#65038; Nanna Status</button>"
    + "<p class='center' style='margin-top:10px'><button class='backlink' onclick='renderDoor()'>&#8592; Back</button></p></div>";
  app().innerHTML = h; window.scrollTo(0, 0);
}
function doorStatus(who) { window.__doorPassed = true; renderPin(who); }
function doorSreshta() { doorPinBuf = ""; renderDoorPin(); }
function doorDotsHtml() {
  var h = "";
  for (var i = 0; i < 4; i++) h += "<span class='" + (i < doorPinBuf.length ? "on" : "") + "'></span>";
  return h;
}
function renderDoorPin() {
  var h = doorHead()
    + "<div class='doorcard' id='doorPinCard'><h2>&#11088; Sreshta&rsquo;s Passcode</h2>"
    + "<p class='sub'>Tap your 4 secret numbers</p>"
    + "<div class='pindots' id='doorDots'>" + doorDotsHtml() + "</div>"
    + "<div class='feedback' id='doorFb'></div>"
    + "<div class='padgrid'>"
    + "<button class='padkey' onclick='doorKey(\"1\")'>1</button><button class='padkey' onclick='doorKey(\"2\")'>2</button><button class='padkey' onclick='doorKey(\"3\")'>3</button>"
    + "<button class='padkey' onclick='doorKey(\"4\")'>4</button><button class='padkey' onclick='doorKey(\"5\")'>5</button><button class='padkey' onclick='doorKey(\"6\")'>6</button>"
    + "<button class='padkey' onclick='doorKey(\"7\")'>7</button><button class='padkey' onclick='doorKey(\"8\")'>8</button><button class='padkey' onclick='doorKey(\"9\")'>9</button>"
    + "<button class='padkey util' onclick='doorKey(\"clear\")'>Clear</button><button class='padkey' onclick='doorKey(\"0\")'>0</button><button class='padkey util' onclick='doorKey(\"back\")'>&#9003;</button>"
    + "</div>"
    + "<p class='center' style='margin-top:8px'><button class='backlink' onclick='renderDoor()'>&#8592; Back</button></p></div>";
  app().innerHTML = h; window.scrollTo(0, 0);
}
function doorKey(k) {
  var fb = document.getElementById("doorFb");
  if (k === "clear") doorPinBuf = "";
  else if (k === "back") doorPinBuf = doorPinBuf.slice(0, -1);
  else if (doorPinBuf.length < 4) doorPinBuf += k;
  var dots = document.getElementById("doorDots");
  if (dots) dots.innerHTML = doorDotsHtml();
  if (fb) fb.textContent = "";
  if (doorPinBuf.length === 4) {
    if (doorPinBuf === DOOR_PIN_SRESHTA) {
      window.__doorPassed = true;
      setGuest("Sreshta"); lockNote = ""; renderHome();
    } else {
      var card = document.getElementById("doorPinCard");
      if (card) { card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
      if (fb) fb.textContent = "Hmm, that is not the passcode \u2014 try again, Sreshta! \uD83C\uDF3C";
      doorPinBuf = "";
      if (dots) dots.innerHTML = doorDotsHtml();
    }
  }
}

/* Island button scope (Ram): it appears ONLY on the festival door screens
   (door choice, Sreshta PIN pad, parents choice) and on the home screen —
   never floating over lessons, exams or status pages. Synced from the
   rendered DOM on every view change: a door view contains .doorcard, the
   home view contains .journey. The pill sits bottom-left (matching the
   other portals, so it never covers an app's own top-left back controls). */
function islandBtnSync() {
  var a = app(), b = document.getElementById("islandBackBtn");
  if (!a || !b) return;
  var show = !!(a.querySelector(".doorcard") || a.querySelector(".journey"));
  b.style.display = show ? "inline-flex" : "none";
}
new MutationObserver(islandBtnSync).observe(document.getElementById("app"), { childList: true, subtree: true });

/* boot — the festival door is the first screen on every load */
renderDoor();
islandBtnSync();
</script>
