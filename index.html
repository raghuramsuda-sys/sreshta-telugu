<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sreshta Telugu — All Weeks Game</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Noto Sans Telugu", "Noto Sans", sans-serif; background: #FFF3D6; color: #191930; min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 10px 12px 16px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .brand { color: #6D28D9; font-weight: 900; letter-spacing: 1px; font-size: 17px; }
  .stars { color: #B26A00; font-size: 20px; font-weight: 900; }
  h1 { font-size: 27px; line-height: 1.15; margin: 4px 0 2px; text-align: center; }
  h2 { font-size: 21px; margin: 4px 0 3px; text-align: center; }
  .sub { color: #3D3D5C; font-size: 14.5px; line-height: 1.35; text-align: center; }
  .center { text-align: center; }
  .strip { height: 8px; border-radius: 99px; margin: 8px 0 2px; background: linear-gradient(90deg,#EF476F,#FF9F1C,#FFD166,#06D6A0,#118AB2,#9B5DE5,#F15BB5); }
  .progress { background: #fff; border: 3px solid #191930; border-radius: 16px; padding: 12px 14px; margin: 14px 0; }
  .progress .bar { background: #EDEDF4; border-radius: 99px; height: 16px; margin-top: 8px; overflow: hidden; }
  .progress .fill { background: linear-gradient(90deg,#EF476F,#FF9F1C,#FFD166,#06D6A0,#118AB2,#9B5DE5); height: 100%; border-radius: 99px; }
  .journey { background: #fff; border: 3px solid #191930; border-radius: 14px; padding: 9px 11px; margin: 8px 0 2px; }
  .journey .jt { font-weight: 900; font-size: 15.5px; text-align: center; }
  .journey .segs { display: flex; gap: 4px; margin: 8px 0 6px; }
  .journey .seg { flex: 1; height: 23px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 900; border: 2px solid #191930; }
  .journey .seg.future { opacity: .28; }
  .journey .seg.now { outline: 4px solid #191930; transform: scale(1.12); }
  .journey .jend { text-align: center; font-size: 13px; font-weight: 700; color: #3D3D5C; }
  .weekhead { display: flex; align-items: center; gap: 12px; width: 100%; background: #6D28D9; color: #fff; border: none;
    border-radius: 16px; padding: 15px 16px; margin: 18px 0 4px; cursor: pointer; font-family: inherit; text-align: left; }
  .weekhead .wt { flex: 1; }
  .weekhead .wt .n { font-weight: 900; font-size: 20px; }
  .weekhead .wt .t { font-size: 15px; opacity: .92; }
  .weekhead .wt .d { font-size: 13px; opacity: .8; }
  .weekhead .arrow { font-size: 20px; font-weight: 900; }
  .badge { font-weight: 900; font-size: 10.5px; border-radius: 999px; padding: 3px 7px; white-space: nowrap; }
  .badge.done { background: #22B573; color: #fff; }
  .badge.active { background: #FFD166; color: #332300; }
  .badge.soon { background: #EDEDF4; color: #3D3D5C; }
  .daycard { display: flex; flex-direction: column; align-items: stretch; gap: 3px; background: #fff; border: 3px solid #191930; border-radius: 14px; padding: 7px 9px; margin: 0; cursor: pointer; text-align: left; width: 100%; font-family: inherit; }
  .daynum { font-weight: 900; font-size: 12.5px; border-radius: 8px; padding: 4px 8px; text-align: center; line-height: 1.2; }
  .dayinfo { flex: 1; }
  .dayinfo .t { font-weight: 900; font-size: 13px; color: #191930; }
  .dayinfo .l { font-size: 15.5px; font-weight: 700; color: #3D3D5C; }
  .dayinfo .dt { font-size: 13px; color: #6A6A85; }
  .soonbox { background: #fff; border: 3px dashed #6A6A85; border-radius: 14px; padding: 10px 12px; margin: 8px 0; font-size: 14px; line-height: 1.55; color: #3D3D5C; }
  .btn { display: inline-block; background: #6D28D9; color: #fff; border: none; cursor: pointer; font-family: inherit;
    font-weight: 900; font-size: 18.5px; padding: 12px 30px; border-radius: 999px; margin-top: 12px; box-shadow: 0 4px 0 #3F1478; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3F1478; }
  .btn.green { background: #22B573; box-shadow: 0 4px 0 #146C43; }
  .btn.ghost { background: #fff; color: #191930; border: 3px solid #191930; box-shadow: none; }
  .foramma { background: #fff; border: 3px solid #FF9F1C; border-radius: 14px; padding: 9px 12px; margin-top: 12px;
    font-size: 13.5px; line-height: 1.5; color: #191930; text-align: left; }
  .foramma b { color: #B25F00; }
  .bigletter { border: 5px solid #191930; border-radius: 24px; margin: 8px auto;
    width: min(64vw, 29dvh); height: min(64vw, 29dvh); line-height: min(64vw, 29dvh); font-size: min(36vw, 16.5dvh); font-weight: 900; cursor: pointer; user-select: none; text-align: center; }
  .bigletter.pop { animation: pop .45s ease; }
  @keyframes pop { 0% { transform: scale(1);} 40% { transform: scale(1.07);} 100% { transform: scale(1);} }
  .soundpill { display: inline-block; background: #191930; color: #FFD166; font-weight: 900; font-size: 16.5px; padding: 6px 18px; border-radius: 999px; }
  .hint { color: #3D3D5C; margin-top: 6px; font-size: 14px; text-align: center; }
  .wordbox { background: #fff; border: 4px solid #191930; border-radius: 18px; padding: 8px 10px 6px; margin: 10px auto 0; height: 100px;
    max-width: 360px; text-align: center; opacity: 0; transform: scale(.92); pointer-events: none; transition: all .3s ease; }
  .wordbox.show { opacity: 1; transform: scale(1); pointer-events: auto; }
  .wordbox .w { font-size: 42px; font-weight: 900; color: #191930; }
  .wordbox .m { color: #C24300; font-size: 15.5px; font-weight: 700; margin-top: 2px; }
  .hear { background: #118AB2; color: #fff; border: none; font-family: inherit; font-size: 15.5px; font-weight: 900;
    padding: 9px 20px; border-radius: 999px; margin-top: 10px; cursor: pointer; }
  .slots, .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px 0; }
  .slot { width: 46%; min-height: 82px; background: #fff; border: 3px dashed #6A6A85; border-radius: 18px; padding: 8px 4px; cursor: pointer; text-align: center; }
  .slot .sw { font-size: 23px; font-weight: 900; color: #191930; }
  .slot .sm { color: #C24300; font-size: 11.5px; font-weight: 700; }
  .slot .ans { font-size: 32px; font-weight: 900; min-height: 36px; color: #6D28D9; }
  .slot.done { border-style: solid; border-color: #22B573; background: #E4F8EC; }
  .tile { width: 58px; height: 58px; line-height: 53px; font-size: 31px; font-weight: 900;
    border-radius: 18px; cursor: grab; user-select: none; touch-action: none; text-align: center; border: 3px solid #191930; }
  .tile.sel { outline: 5px solid #191930; transform: scale(1.1); }
  .tile.used { visibility: hidden; }
  .feedback { min-height: 24px; font-size: 17px; font-weight: 900; color: #146C43; margin-top: 8px; text-align: center; }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-8px);} 75% { transform: translateX(8px);} }
  .quizword { font-size: 46px; font-weight: 900; margin: 10px 0 2px; text-align: center; color: #191930; }
  .opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 20px; }
  .opt { width: 102px; height: 84px; font-size: 44px; font-weight: 900; font-family: inherit; border-radius: 20px; cursor: pointer; border: 4px solid #191930; }
  .opt.right { background: #22B573 !important; color: #fff !important; }
  .opt.wrong { background: #E63946 !important; color: #fff !important; }
  .burst { position: fixed; font-size: 30px; color: #FF9F1C; text-shadow: 0 0 3px #7a4a00; pointer-events: none; animation: burst .9s ease forwards; z-index: 50; }
  @keyframes burst { from { opacity: 1; transform: translate(0,0) scale(1);} to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.5);} }
  .finishstars { font-size: 32px; color: #FF9F1C; text-shadow: 0 0 3px #7a4a00; letter-spacing: 6px; margin: 10px 0; text-align: center; }
  .gn { font-size: 32px; font-weight: 900; color: #6D28D9; margin: 8px 0; text-align: center; }
  .dots { text-align: center; margin: 4px 0 8px; }
  .dots span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #C9C9D6; margin: 0 3px; }
  .dots span.on { background: #6D28D9; }
  .backlink { background: none; border: none; font-family: inherit; font-size: 16px; font-weight: 900; color: #6D28D9; cursor: pointer; padding: 6px 0; }

  .wgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 8px 0 2px; }
  .wsq { border: 3px solid #191930; border-radius: 12px; padding: 6px 0 4px; text-align: center; cursor: pointer; font-family: inherit; }
  .wsq .n { font-size: 16.5px; font-weight: 900; display: block; line-height: 1.1; }
  .wsq .s { font-size: 9.5px; font-weight: 700; display: block; }
  .wpanel { margin-top: 4px; }
  .wpanel .wt2 { font-weight: 900; font-size: 16.5px; }
  .wpanel .wd { font-size: 12.5px; color: #6A6A85; }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 7px; }
  .dtop { display: flex; justify-content: space-between; align-items: center; width: 100%; }
</style>
</head>

var lockNote = "";
function weekUnlocked(wk) {

function dayUnlocked(wk, idx) {
  if (!weekUnlocked(wk)) return false;
  if (idx === 0) return true;
  var pd = wk.days[idx - 1];
  if (!(store[pd.id] && store[pd.id].done)) return false;
  if (idx === 2) return examPassed("w" + wk.n + "e1");
  if (idx === 4) return examPassed("w" + wk.n + "e2");

}
function dayLockReason(wk, idx) {

  if (pd && !(store[pd.id] && store[pd.id].done)) return "finish " + pd.label + " first!";
  if (idx === 2) return "Pass Exam 1 with 70% to open this day!";
  if (idx === 4) return "Pass Exam 2 with 70% to open this day!";
  return "finish the day before it first!";

}

}
function fmtDate(iso) {

  catch (e) { return ""; }
}
function weeksDoneOf(pl) {

/* ===== Exams (70% pass gates) ===== */
var PASS_MARK = 70;
var EXAMS = [
  { id: "w1e1", week: 1, title: "Exam 1", sub: "Days 1 & 2", dayIds: ["w1d1", "w1d2"], n: 8 },
  { id: "w1e2", week: 1, title: "Exam 2", sub: "Days 3 & 4", dayIds: ["w1d3", "w1d4"], n: 8 },
  { id: "w1e3", week: 1, title: "Weekly Exam", sub: "Whole Week 1", dayIds: ["w1d1", "w1d2", "w1d3", "w1d4", "w1d5", "w1d6", "w1d7"], n: 12 }
];
function examById(id) { for (var i = 0; i < EXAMS.length; i++) if (EXAMS[i].id === id) return EXAMS[i]; return null; }
function examPassed(id) { var r = exams[id]; return !!(r && r.passed); }
function examUnlocked(ex) { return ex.dayIds.every(function(id) { return store[id] && store[id].done; }); }
function dayById(id) {
  for (var w = 0; w < WEEKS.length; w++) { var wk = WEEKS[w]; if (wk.days) for (var i = 0; i < wk.days.length; i++) if (wk.days[i].id === id) return wk.days[i]; }
  return null;
}
function examPool(ex) {
  var seen = {}, pool = [];
  ex.dayIds.forEach(function(id) { var d = dayById(id); if (d) d.letters.forEach(function(it) { if (!seen[it.L]) { seen[it.L] = 1; pool.push(it); } }); });
  return pool;
}
function examCards(wk) {
  var list = EXAMS.filter(function(e) { return e.week === wk.n; });
  if (!list.length) return "";
  var h = "";
  list.forEach(function(ex) {
    var r = exams[ex.id], un = examUnlocked(ex);
    if (r && r.passed) {
      h += "<button class='daycard' style='margin-top:8px;border-color:#1E9E62' onclick='startExam(\"" + ex.id + "\")'><span class='dtop'><span class='daynum' style='background:#1E9E62;color:#fff'>&#128221; " + ex.title + "</span><span class='badge done'>&#10003; " + r.best + "%</span></span><span class='dayinfo'><span class='t'>Passed! Tap to take again</span><br><span class='l' style='font-size:13px'>" + ex.sub + " \u2022 Best score " + r.best + "%</span></span></button>";
    } else if (un) {
      h += "<button class='daycard' style='margin-top:8px;border-color:#B3541E' onclick='startExam(\"" + ex.id + "\")'><span class='dtop'><span class='daynum' style='background:#FF9F1C;color:#332300'>&#128221; " + ex.title + "</span><span class='badge' style='background:#FFD166;color:#332300'>" + (r ? "Retake" : "Take Exam") + "</span></span><span class='dayinfo'><span class='t'>" + ex.sub + " \u2022 " + ex.n + " questions</span><br><span class='l' style='font-size:13px'>" + (r ? "Last try " + r.last + "% \u2014 " : "") + "Need " + PASS_MARK + "% to pass</span></span></button>";
    } else {
      h += "<div class='daycard' style='margin-top:8px;opacity:.75;cursor:default'><span class='dtop'><span class='daynum' style='background:#C9C9D6;color:#191930'>&#128221; " + ex.title + "</span><span class='badge soon'>&#128274;</span></span><span class='dayinfo'><span class='t'>" + ex.sub + "</span><br><span class='l' style='font-size:13px'>Finish the days above first</span></span></div>";
    }
  });
  return h;
}
var examCur = null, examLock = false;
function startExam(id) {
  var ex = examById(id); if (!ex || !examUnlocked(ex)) return;
  var pool = examPool(ex);
  var picked = shuffled(pool, (Date.now() % 89) + 1).slice(0, Math.min(ex.n, pool.length));
  var qs = picked.map(function(it, i) {
    var others = pool.filter(function(x) { return x !== it; });
    var dis = shuffled(others, i * 7 + 3).slice(0, 3);
    return { it: it, type: (i % 2 === 0) ? "w2l" : "l2w", opts: shuffled([it].concat(dis), i + 11) };
  });
  examCur = { ex: ex, qs: qs, i: 0, score: 0 };
  renderExamQ();
}
function renderExamQ() {
  examLock = false;
  var q = examCur.qs[examCur.i], ex = examCur.ex;
  var prompt = q.type === "w2l" ? q.it.word : q.it.L;
  var ask = q.type === "w2l" ? "Which letter does this word start with?" : "Which word starts with this letter?";
  var h = "<button class='backlink' onclick='renderHome()'>&#8592; All Weeks</button>"
    + "<h2>&#128221; " + ex.title + " \u2014 " + ex.sub + "</h2>"
    + "<p class='sub'>Question " + (examCur.i + 1) + " of " + examCur.qs.length + " \u2022 One tap is final \u2014 no second chance!</p>"
    + "<div class='quizword' style='font-size:" + (q.type === "w2l" ? "50px" : "74px") + "'>" + prompt + "</div>"
    + "<p class='sub'>" + ask + "</p><div id='examopts'></div><div class='feedback' id='examfb'></div>";
  app().innerHTML = h; window.scrollTo(0, 0);
  var host = document.getElementById("examopts");
  host.className = q.type === "w2l" ? "opts" : "center";
  q.opts.forEach(function(o) {
    var b = document.createElement("button");
    if (q.type === "w2l") { b.className = "opt"; b.textContent = o.L; var c = LC(o.L); b.style.background = c.bg; b.style.color = c.fg; }
    else { b.textContent = o.word; b.style.cssText = "display:block;width:88%;margin:8px auto;padding:13px;font-family:inherit;font-size:25px;font-weight:900;background:#fff;border:3.5px solid #191930;border-radius:14px;cursor:pointer"; }
    b.addEventListener("click", function(ev) { examAnswer(b, o === q.it, ev); });
    host.appendChild(b);
  });
}
function examAnswer(btn, correct, ev) {
  if (examLock) return; examLock = true;
  if (correct) { examCur.score++; btn.style.background = "#1E9E62"; btn.style.color = "#fff"; addStar(ev.clientX, ev.clientY); document.getElementById("examfb").textContent = "Correct!"; }
  else { btn.style.background = "#E63946"; btn.style.color = "#fff"; document.getElementById("examfb").textContent = "Wrong \u2014 next question"; }
  setTimeout(function() {
    examCur.i++;
    if (examCur.i < examCur.qs.length) renderExamQ(); else renderExamResult();
  }, 600);
}
function renderExamResult() {

  save(); pushCloud();
  var isWeekly = ex.id.slice(-2) === "e3";
  var h = "<div class='center' style='font-size:38px'>" + (passed ? "&#127881;" : "&#128170;") + "</div>"
    + "<h1>" + (passed ? "Passed!" : "Almost!") + "</h1>"

    + "<p class='sub'>" + ex.title + ": <b>" + score + " of " + total + "</b> correct.<br>"
    + (passed ? (isWeekly ? "Week complete! The next week is now open." : "The next days are now open. Superb!") : "You need " + PASS_MARK + "% to pass.<br>Practice the days once more, then take the exam again. You can do it!")
    + "</p><div class='center'><button class='btn green' onclick='renderHome()'>&#127968; All Weeks</button></div>";
  app().innerHTML = h; window.scrollTo(0, 0);
  examCur = null;
}

/* boot */
if (guestName) { guestSlug = slugify(guestName) || "guest"; renderHome(); if (cloudObj) { cloudLoaded = true; pullCloud(); } }
else { renderNameScreen(); }
</script>
